<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05050a">
  <title>Questism System - AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false },
      theme: {
        extend: {
          colors: {
            'sys-black': '#05050a',
            'neon-blue': '#00f0ff',
            'neon-purple': '#a855f7',
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      background-color: #05050a !important;
      color: #f1f5f9;
      font-family: monospace;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
    }
    .scanline {
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
      background-size: 100% 4px;
    }
    @keyframes floatAura {
      0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 15px #00f0ff); }
      50% { transform: translateY(-8px); filter: drop-shadow(0 0 25px #a855f7); }
    }
    .anime-aura { animation: floatAura 4s ease-in-out infinite; }
  </style>
</head>
<body class="scanline min-h-screen w-full m-0 p-4 select-none flex flex-col justify-between items-center bg-[#05050a]">

  <!-- TOP HUD: PLAYER STATUS -->
  <header class="w-full max-w-md bg-[rgba(12,14,28,0.85)] border-2 border-purple-500/70 rounded-xl p-4 shadow-[0_0_15px_rgba(168,85,247,0.3)] backdrop-blur-md">
    <div class="flex justify-between items-center border-b border-purple-500/30 pb-2">
      <div>
        <h1 class="text-xl font-black tracking-widest text-[#00f0ff] m-0">PLAYER #001</h1>
        <p id="ist-clock" class="text-[10px] text-purple-400 font-semibold tracking-wider m-0">IST 00:00:00</p>
      </div>
      <span class="text-xs font-bold bg-purple-950/80 border border-purple-500 px-3 py-1 rounded text-purple-400 shadow-[0_0_8px_#a855f7]">
        E-RANK
      </span>
    </div>
  </header>

  <!-- CENTER PANEL: ANIMATED ANIME GIRL SYSTEM AI ASSISTANT -->
  <main class="w-full max-w-md my-4 p-5 rounded-2xl bg-[rgba(12,14,28,0.85)] border-2 border-[#00f0ff] shadow-[0_0_20px_rgba(0,240,255,0.4)] backdrop-blur-md flex flex-col items-center">
    
    <!-- AI ASSISTANT TITLE -->
    <div class="w-full flex justify-between items-center border-b border-cyan-500/30 pb-2 mb-3">
      <span class="text-[10px] font-extrabold uppercase tracking-widest px-2 py-0.5 rounded bg-cyan-500/20 text-[#00f0ff] border border-[#00f0ff]">
        SYSTEM AI ASSISTANT
      </span>
      <span class="text-[10px] text-emerald-400 font-bold">STATUS: ONLINE</span>
    </div>

    <!-- ANIMATED ANIME GIRL AVATAR -->
    <div class="relative my-2">
      <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExdWpzeGs1OHJ3bXExdHA5dzUydTFyeXAwazZ5bWszNmsxcDFseGdpbyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/L1R1tvI9svvIWwpVYz/giphy.gif" 
           alt="System Anime Girl Assistant" 
           class="h-56 w-56 rounded-full object-cover border-4 border-[#00f0ff] anime-aura shadow-[0_0_20px_#00f0ff]">
    </div>

    <!-- AI DIALOGUE BOX -->
    <div class="w-full mt-4 p-3 bg-slate-950/90 border border-purple-500/50 rounded-xl shadow-inner">
      <p class="text-[10px] text-purple-400 font-bold tracking-widest m-0 uppercase">[ SYSTEM AI LOG ]</p>
      <p id="ai-dialogue" class="text-xs text-cyan-200 mt-1 m-0 leading-relaxed">
        "Welcome back, Player #001. I am your personal System Interface. All daily quests and class schedule timers are operating normally."
      </p>
    </div>

    <!-- ACTION BUTTON -->
    <button onclick="speakAIDialogue()" class="w-full mt-4 py-2.5 rounded-xl font-black text-xs uppercase tracking-widest bg-purple-950/40 border border-purple-500 hover:bg-purple-900/50 text-purple-300 transition-all shadow-[0_0_10px_#a855f7]">
      INTERACT WITH SYSTEM AI
    </button>
  </main>

  <footer class="text-[10px] text-slate-600 my-2 tracking-widest">
    [ SYSTEM AI ASSISTANT v2.0 ACTIVE ]
  </footer>

  <script>
    // IST Clock
    setInterval(() => {
      const now = new Date();
      const istString = now.toLocaleTimeString('en-US', { timeZone: 'Asia/Kolkata', hour12: false });
      document.getElementById('ist-clock').innerText = `IST ${istString}`;
    }, 1000);

    // Interactive AI Responses
    const dialogues = [
      '"Player #001, your class schedule is being monitored in real-time. Do not miss any quests!"',
      '"Remember to complete your daily side quests to gain extra STR and INT stats."',
      '"System alert: System lock will be triggered if penalty timer expires."',
      '"You are currently E-RANK. Level up continuously to evolve your system authority!"'
    ];

    function speakAIDialogue() {
      const randomIndex = Math.floor(Math.random() * dialogues.length);
      document.getElementById('ai-dialogue').innerText = dialogues[randomIndex];
    }
  </script>
</body>
</html>

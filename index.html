<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYSTEM — Player #001</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#030712; --panel:rgba(8,15,30,0.85); --acc:#00f0ff; --r:#ff3366; --g:#00ff88;
  --c:#8a2be2; --txt:#e2e8f0; --dim:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{
  background:var(--bg);color:var(--txt);font-family:Rajdhani,sans-serif;
  min-height:100vh;display:flex;justify-content:center;padding:12px;
  background-image:radial-gradient(circle at 50% 0%, rgba(0,240,255,0.15), transparent 70%);
}
h1,h2,.orb{font-family:Orbitron,Arial,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--acc);border-radius:4px;padding:14px;box-shadow:0 0 20px rgba(0,240,255,0.15);position:relative}
.top{display:flex;justify-content:space-between;align-items:center}
.name{font-size:12px;letter-spacing:.2em;opacity:.7}
.player{font-family:Orbitron;font-weight:700;font-size:20px;text-shadow:0 0 10px var(--acc)}
.rank{font-family:Orbitron;font-weight:900;font-size:15px;padding:6px 12px;border:2px solid var(--acc);color:var(--acc);text-shadow:0 0 8px var(--acc);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 26px var(--acc),inset 0 0 14px var(--acc)}}
.lv{margin:10px 0 6px;font-family:Orbitron;font-size:13px;display:flex;justify-content:space-between}
.bar{height:12px;background:#0b1520;border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);position:relative;overflow:hidden;margin-bottom:8px}
.fill{height:100%;transition:width .6s cubic-bezier(.2,.9,.3,1)}
#xpf{background:linear-gradient(90deg,#0086ff,var(--c));box-shadow:0 0 12px var(--c)}
#hpf{background:linear-gradient(90deg,#a00025,var(--r));box-shadow:0 0 12px var(--r)}
.bar span{position:absolute;right:6px;top:-2px;font-size:10px;font-family:Orbitron;text-shadow:0 0 4px #000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);padding:8px;text-align:center;background:rgba(0,0,0,.3)}
.stat b{font-family:Orbitron;font-size:11px;letter-spacing:.15em;display:block;opacity:.8}
.stat em{font-style:normal;font-family:Orbitron;font-size:24px;font-weight:700;text-shadow:0 0 10px var(--acc)}
.plus{display:block;width:100%;margin-top:4px;background:transparent;border:1px solid var(--acc);color:var(--acc);font:700 16px Orbitron;cursor:pointer}
.plus:disabled{opacity:.25;cursor:not-allowed}.plus:not(:disabled):hover{background:var(--acc);color:#000}
.pts{font-size:13px;margin-top:8px;text-align:right;opacity:.85}
.quest{text-align:center;padding:22px 14px}
.tag{font-family:Orbitron;font-size:11px;letter-spacing:.3em;color:var(--acc);border:1px solid var(--acc);display:inline-block;padding:3px 10px;margin-bottom:10px}
.quest h2{font-size:19px;line-height:1.3;text-shadow:0 0 12px var(--acc)}
.sub{color:var(--r);font-weight:600;margin-top:6px;font-size:15px;text-shadow:0 0 6px rgba(255,0,60,.6)}
.timer{font-family:Orbitron;font-weight:900;font-size:58px;margin:14px 0;color:var(--acc);text-shadow:0 0 20px var(--acc)}
.timer.low{color:var(--r);text-shadow:0 0 24px var(--r);animation:blink .6s infinite}
@keyframes blink{50%{opacity:.4}}
.btn{font-family:Orbitron;font-weight:700;letter-spacing:.12em;font-size:14px;padding:13px 22px;background:color-mix(in srgb,var(--acc) 14%,transparent);border:2px solid var(--acc);color:var(--acc);cursor:pointer;width:100%;transition:.2s;text-shadow:0 0 8px var(--acc)}
.btn:hover:not(:disabled){background:var(--acc);color:#000;text-shadow:none}
.btn:disabled{opacity:.3;cursor:not-allowed}
.aria{border-color:var(--r);box-shadow:0 0 20px rgba(255,51,102,.2)}
.aria .tag{color:var(--r);border-color:var(--r)}
.aria p{font-size:15px;line-height:1.45;min-height:48px}
.bot-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.nav-btn{font-family:Orbitron;font-size:10px;padding:10px 4px;background:rgba(0,0,0,.4);border:1px solid var(--dim);color:var(--txt);cursor:pointer;text-align:center}
.nav-btn.act{border-color:var(--acc);color:var(--acc);box-shadow:0 0 8px var(--acc)}
</style>
</head>
<body>

<div id="app">
  <div class="panel">
    <div class="top">
      <div>
        <div class="name">PLAYER STATUS</div>
        <div class="player">JINWOO</div>
      </div>
      <div class="rank" id="rnk">F-RANK</div>
    </div>
    <div class="lv"><span>LEVEL <b id="lvl">1</b></span><span id="job">UNAWAKENED</span></div>
    
    <div class="bar"><div class="fill" id="hpf" style="width:100%"></div><span>HP 100/100</span></div>
    <div class="bar"><div class="fill" id="xpf" style="width:0%"></div><span id="xpt">EXP 0/100</span></div>

    <div class="stats">
      <div class="stat"><b>STR</b><em id="str">10</em><button class="plus" onclick="up('str')">+</button></div>
      <div class="stat"><b>AGI</b><em id="agi">10</em><button class="plus" onclick="up('agi')">+</button></div>
      <div class="stat"><b>INT</b><em id="int">10</em><button class="plus" onclick="up('int')">+</button></div>
    </div>
    <div class="pts">AVAILABLE POINTS: <b id="pts" style="color:var(--acc)">0</b></div>
  </div>

  <div class="panel aria">
    <div class="tag">SYSTEM ASSISTANT</div>
    <p id="ariatxt">"Greetings, Player. Complete daily quests to earn EXP and stat points."</p>
    
    <!-- WEB APIs BUTTONS -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;">
      <button class="btn" onclick="speakAIDialogue()" style="font-size:11px;padding:8px;border-color:var(--r);color:var(--r)">🔊 SPEAK LOG</button>
      <button class="btn" onclick="startVoiceRecognition()" style="font-size:11px;padding:8px;">🎙️ VOICE CMD</button>
    </div>
  </div>

  <div class="panel quest">
    <div class="tag">DAILY QUEST</div>
    <h2 id="qt">PREPARE FOR THE DAY</h2>
    <div class="sub" id="qd">Get ready and head to class</div>
    <div class="timer" id="tm">00:00</div>
    <button class="btn" id="act" onclick="verifyGPSLocation()">VERIFY GPS LOCATION</button>
  </div>

  <div class="bot-nav">
    <button class="nav-btn act">STATUS</button>
    <button class="nav-btn">QUESTS</button>
    <button class="nav-btn">INVENTORY</button>
    <button class="nav-btn">SETTINGS</button>
  </div>
</div>

<script>
  let xp = 0, lvl = 1, pts = 0;
  let stats = { str: 10, agi: 10, int: 10 };

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playBeep(freq = 440, duration = 0.1) {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch (e) {}
  }

  function addXP(amount) {
    xp += amount;
    if (xp >= 100) {
      xp -= 100;
      lvl++;
      pts += 3;
      playBeep(880, 0.3);
      document.getElementById('ariatxt').innerText = `LEVEL UP! You reached Level ${lvl}. Earned 3 stat points.`;
    }
    updateUI();
  }

  function up(stat) {
    if (pts > 0) {
      stats[stat]++;
      pts--;
      playBeep(520, 0.05);
      updateUI();
    }
  }

  function updateUI() {
    document.getElementById('lvl').innerText = lvl;
    document.getElementById('pts').innerText = pts;
    document.getElementById('str').innerText = stats.str;
    document.getElementById('agi').innerText = stats.agi;
    document.getElementById('int').innerText = stats.int;
    document.getElementById('xpf').style.width = xp + '%';
    document.getElementById('xpt').innerText = `EXP ${xp}/100`;

    document.querySelectorAll('.plus').forEach(btn => {
      btn.disabled = pts <= 0;
    });
  }

  function speakAIDialogue() {
    playBeep(600, 0.05);
    const txt = document.getElementById('ariatxt').innerText;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      window.speechSynthesis.speak(u);
    }
  }

  function startVoiceRecognition() {
    playBeep(700, 0.08);
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("Speech Recognition not supported on this browser.");
    const rec = new SpeechRecognition();
    rec.lang = 'en-US';
    document.getElementById('ariatxt').innerText = "Listening for voice command...";
    
    rec.onresult = (e) => {
      const cmd = e.results[0][0].transcript;
      document.getElementById('ariatxt').innerText = `Voice Command: "${cmd}"`;
      if (cmd.toLowerCase().includes("verify") || cmd.toLowerCase().includes("gps") || cmd.toLowerCase().includes("check")) {
        verifyGPSLocation();
      }
    };
    rec.start();
  }

  function verifyGPSLocation() {
    playBeep(800, 0.1);
    const el = document.getElementById('ariatxt');
    if ("geolocation" in navigator) {
      el.innerText = "Acquiring GPS coordinates...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          el.innerText = `GPS Verified! Lat: ${pos.coords.latitude.toFixed(2)}, Lon: ${pos.coords.longitude.toFixed(2)}`;
          addXP(50);
        },
        (err) => {
          el.innerText = `GPS Check Bypassed (+50 EXP Granted!)`;
          addXP(50);
        }
      );
    } else {
      el.innerText = "Geolocation not supported.";
      addXP(50);
    }
  }

  // Timer simulation
  let seconds = 3600;
  setInterval(() => {
    if (seconds > 0) {
      seconds--;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('tm').innerText = `${m}:${s}`;
    }
  }, 1000);

  updateUI();
</script>
</body>
</html>
